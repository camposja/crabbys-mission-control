# Supply-chain hardening. Requires pnpm >= 11. See team plan "adaptive-conjuring-nebula".
# Install with `mise exec -- corepack pnpm install`, NEVER npm/yarn — see README.
minimumReleaseAge: 10080       # 7 days — don't install versions published <7d ago
minimumReleaseAgeStrict: true  # fail rather than silently fall back to an older version
blockExoticSubdeps: true       # transitive deps must come from the registry, not git/tarball/url
strictDepBuilds: true          # FAIL install on any unreviewed build/postinstall script
dangerouslyAllowAllBuilds: false
allowBuilds: {}
# Empty by design: verified (pnpm v11.19.0, 518 deps) that NO dependency in this
# tree declares a preinstall/install/postinstall script — Vite 8 uses Rolldown,
# not esbuild. strictDepBuilds:true will hard-fail the install if any future
# dependency adds a build script; review it and add `name: true` here only then.

# Security patches for transitive deps whose parents pin an older patch line.
# Same major version in every case — these are patches, not upgrades. Each is
# still subject to minimumReleaseAge above.
overrides:
  js-yaml@^4: ^4.3.1              # eslint > @eslint/eslintrc (GHSA prototype/DoS fixes)
  brace-expansion@^1: ^1.1.18     # eslint > minimatch (ReDoS)
  "@babel/core@^7": ^7.29.6       # eslint-plugin-react-hooks (file read via sourceMappingURL)
