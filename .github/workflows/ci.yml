# Repository-root CI. The previous copy lived at backend/.github/workflows/ci.yml,
# where GitHub never ran it, and its steps assumed the repo root was backend/.
#
# Every step below is green on main as of this commit — no continue-on-error and
# nothing is skipped. Two checks are still NOT gates, for stated reasons:
#   * rubocop  — 241 pre-existing style offenses. Changed files are linted by
#               hand; adding it here needs a reviewed .rubocop_todo.yml first.
#   * brakeman — down to a single weak-confidence SendFile warning on the resume
#               download, which is inherent to letting a person choose a file by
#               name. The path is picked from a directory listing and specs cover
#               traversal, sibling-prefix and symlink escapes; run
#               `bundle exec brakeman` to review it. It is left out rather than
#               silenced with an ignore entry.
# Do not paper over either of them with continue-on-error.
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # pnpm always comes from Corepack, pinned by packageManager in package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Report any ignored dependency build scripts
        run: corepack pnpm ignored-builds

      - name: Lint
        run: corepack pnpm lint

      - name: Tests
        run: corepack pnpm test

      - name: Production build
        run: corepack pnpm build

      - name: Audit dependencies
        run: corepack pnpm audit

  ruby:
    name: Backend (Rails)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Verify the bundle is installed
        run: bundle check

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Specs
        run: bundle exec rspec

      - name: Scan for known security vulnerabilities in gems used
        run: bundle exec bundler-audit check --update
