# Repository-root Dependabot config. The previous copy lived at
# backend/.github/dependabot.yml, where GitHub never read it.
#
# Deliberately low-noise: weekly, grouped into one PR per ecosystem for
# minor/patch updates, a small PR cap, and majors left ungrouped so they get
# reviewed individually. Nothing here merges automatically.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Majors are upgrades, not maintenance: they need a person to read the
    # changelog and check the app still behaves. Security fixes still arrive
    # regardless of this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ruby-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pnpm lockfiles are handled by the npm ecosystem.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
